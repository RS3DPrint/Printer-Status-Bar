[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  fastled/FastLED@^3.9.14
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLED_PIN=5
  -DCHIP_NAME='"ESP32-S3 Feather"'

[env:athom_ls3p_wled_la]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  fastled/FastLED@^3.9.14
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLED_PIN=10
  -DCHIP_NAME='"ESP32-C3 Athom LS3P-WLED-LA"'

